name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets a deploy be re-run from the Actions tab without an empty commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy in flight; a second push waits rather than racing the first.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Builds the engine first (the client imports its compiled output), then
      # the client itself. VITE_BASE matches this repo's Pages project path.
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      # docs/field-guide.html is a standalone static page, checked in and
      # regenerated by `npm run guide` — it isn't part of the Vite build, so
      # it has to be copied into the published output explicitly.
      - run: cp docs/field-guide.html client/dist/field-guide.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
